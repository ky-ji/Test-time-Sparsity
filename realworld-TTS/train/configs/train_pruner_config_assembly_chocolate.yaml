# TTS Pruner Training Configuration
# Similar to SAG config but for TTS async inference

basic:
  task_name: "assembly_chocolate"
  seed: 42
  use_wandb: true

model:
  hidden_dim: 512
  block_encoder: "sin"
  use_obs_encoder: true
  use_obs_emb: true

pruning:
  target_prune_ratio: 0.93

loss:
  consistency: "mse"
  sparse: "target"
  lamb_sparse: 1.0

training:
  batch_size: 36
  epochs: 50
  lr: 0.0001
  min_lr: 0.00001
  patience: 10
  early_stop: true
  optimizer:
    betas: [0.9, 0.999]
    weight_decay:
      transformer: 0.001
