# TTS Acceleration config example - Assembly Bun
# 
#   python tts_accelerator/scripts/run_dp_with_tts.py --config tts_accelerator/configs/assembly_bun.yaml
#

# ===== DP Config =====
checkpoint_path: "/path/to/your/dp_policy.ckpt"  # TODO: Change to your DP checkpoint path
use_ema: true

# ===== Runtime Config =====
server_ip: "0.0.0.0"
server_port: 8007
device: "cuda:0"
scheduler: "DDPM"
num_inference_steps: 100
inference_freq: 20.0

# ===== Action Config =====
action_scale: 1.0
smoothing_alpha: 0.0
max_delta_position: 0.04
max_delta_rotation: 0.1
enable_action_limit: false

# ===== TTS Config =====
enable_tts: true
pruner_checkpoint: ""  # Set to your trained pruner checkpoint path
target_prune_ratio: 0.90

pruner_config:
  hidden_dim: 512
  decoder_layers: 1
  block_encoder: "SA"
  attn_heads: 8
  dim_feedforward: 1024
  dropout: 0.1
  reuse_dp_encoder: true
  reuse_block: true
  if_rollout_cache: true

# ===== Project Root =====
# dp_root: "/path/to/Test-time-Sparsity"  # Optional: project root containing diffusion_policy submodule
